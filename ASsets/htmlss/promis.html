<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promises</title>
    <link rel=" icon" href="./../icon/faviicon1.ico" type="image/x-icon">
    <link rel="stylesheet" href="./../style/index.css">
</head>
<body>
    
<h1>this is promises</h1>



<script>


function getdatafromserver_fu(Condition){

return new Promise((resolveeee,rejecttt)=>{

if(Condition){

    resolveeee("DONE");

}
else{
    rejecttt("ERRORRRR");


}

});

}


let Promisi = getdatafromserver_fu(false);


Promisi.then(
(rsp)=>{
console.log(rsp);

}


).catch(


(erro1)=>{
console.log(erro1);

}
).finally(

()=>{
console.log("promise called");

}

);



</script>

</body>
</html>
